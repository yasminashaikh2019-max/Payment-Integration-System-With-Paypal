mytestkey=This value is from LOCAL properties file

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

paypal.provider.createOrder.url=http://paypal-provider-service/v1/orders
paypal.provider.captureOrder.url.Template=http://paypal-provider-service/v1/orders/{orderId}/capture


# =========================================================
# Spring Boot Actuator Configuration
# =========================================================

# Expose all Spring Boot Actuator endpoints
management.endpoints.web.exposure.include=*

# Enable /actuator/health endpoint
management.endpoint.health.enabled=true

# Include Circuit Breaker health information
management.health.circuitbreakers.enabled=true

# Always show detailed health information
management.endpoint.health.show-details=always


# =========================================================
# Resilience4j Circuit Breaker Configuration
# =========================================================

# Circuit Breaker instance name
resilience4j.circuitbreaker.instances.payment-processing-service.failureRateThreshold=40

# Minimum number of calls required before failure rate is calculated
resilience4j.circuitbreaker.instances.payment-processing-service.minimumNumberOfCalls=3

# Time Circuit Breaker stays OPEN before moving to HALF_OPEN
resilience4j.circuitbreaker.instances.payment-processing-service.waitDurationInOpenState=300s

# Automatically transition from OPEN -> HALF_OPEN
resilience4j.circuitbreaker.instances.payment-processing-service.automaticTransitionFromOpenToHalfOpenEnabled=true

# Number of calls permitted when Circuit Breaker is HALF_OPEN
resilience4j.circuitbreaker.instances.payment-processing-service.permittedNumberOfCallsInHalfOpenState=2

# Number of calls stored in the sliding window
resilience4j.circuitbreaker.instances.payment-processing-service.slidingWindowSize=10

# Sliding window type
resilience4j.circuitbreaker.instances.payment-processing-service.slidingWindowType=COUNT_BASED


#==Eureka Client Configuration==
# Eureka Server URL
eureka.client.service-url.defaultZone=http://eureka-sr-con:8761/eureka/

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch service registry from Eureka
eureka.client.fetch-registry=true

# Prefer IP address for registration
eureka.instance.prefer-ip-address=true
#unique instance ID for this service
eureka.instance.instance-id=${spring.application.name}:${server.port}
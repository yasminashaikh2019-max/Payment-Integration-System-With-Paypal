mytestkey=This value is from LOCAL properties file

paypal.client.id=${P_CLIENT_ID}
paypal.client.secret=${P_CLIENT_SECRET}


paypal.oauth.url=https://api-m.sandbox.paypal.com/v1/oauth2/token
paypal.createOrder.url=https://api-m.sandbox.paypal.com/v2/checkout/orders

paypal.captureOrder.url=https://api-m.sandbox.paypal.com/v2/checkout/orders

# Eureka Client
# ==========================================
eureka.client.service-url.defaultZone=http://eureka-sr-con:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


eureka.instance.lease-expiration-duration-in-seconds=90

# Prefer IP address for registration
eureka.instance.prefer-ip-address=true
#unique instance ID for this service
eureka.instance.instance-id=${spring.application.name}:${server.port}
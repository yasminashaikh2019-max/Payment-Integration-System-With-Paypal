mytestkey=This value is from Dev properties file


 #Eureka Server should not register itself
eureka.client.register-with-eureka=false

# Eureka Server should not fetch registry information
eureka.client.fetch-registry=false

# Start immediately without waiting for peer Eureka servers
eureka.server.wait-time-in-ms-when-sync-empty=0

# Check every 5 seconds for expired/down instances
# Default is 60000 (60 seconds)
eureka.server.eviction-interval-timer-in-ms=5000

# Disable self-preservation in local/dev environment
eureka.server.enable-self-preservation=false
